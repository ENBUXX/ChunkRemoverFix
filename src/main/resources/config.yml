settings:
  admin-permission: "chunkremover.admin"
  delay-seconds: 10

gameplay:
  max-hoppers-per-chunk: 1

performance:
  ticks-per-layer: 2
  max-blocks-per-tick: 500

economy:
  use-custom-prices: true
  prices:
    DIAMOND: 50.0
    DIAMOND_ORE: 50.0
    DEEPSLATE_DIAMOND_ORE: 50.0
    EMERALD: 30.0
    GOLD_INGOT: 20.0
    RAW_GOLD: 15.0
    IRON_INGOT: 10.0
    RAW_IRON: 8.0
    COPPER_INGOT: 5.0
    COAL: 2.0
    ANCIENT_DEBRIS: 200.0
    DEFAULT_PRICE: 1.0

protected-blocks:
  - BEDROCK
  - SPAWNER
  - END_PORTAL_FRAME
  - END_PORTAL
  - NETHER_PORTAL

